<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#183c33"><title>Köfte İmparatorluğu</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#193f37;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px;pointer-events:none;gap:8px}.pill{background:#fffdf1ed;border:2px solid #fff;border-radius:15px;box-shadow:0 3px 0 #23544755;padding:8px 12px;color:#254536;font-weight:900;font-size:15px}.pill small{display:block;font-size:10px;color:#607669;font-weight:700}.pill strong{color:#14845a}#toast{position:fixed;top:83px;left:50%;transform:translateX(-50%);background:#25483de8;color:white;border-radius:20px;padding:9px 15px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}#bottom{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;max-width:96%;align-items:center}button{border:2px solid #fff;background:#fff9df;color:#29503d;border-radius:15px;padding:10px 13px;font-weight:900;font-size:12px;box-shadow:0 4px 0 #254e3d66;white-space:nowrap}button:active{transform:translateY(2px)}#hint{position:fixed;bottom:calc(69px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#204d3bcc;color:#fff;padding:8px 13px;border-radius:18px;font-size:12px;white-space:nowrap;pointer-events:none;text-align:center}@media(max-width:380px){button{padding:9px;font-size:11px}.pill{padding:7px;font-size:13px}}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="pill"><small>💰 RESTORAN KASASI</small><strong id="money">0 ₺</strong></div><div class="pill"><small>🍽️ YIKANAN TABAK</small><span id="washed">0</span> <small style="display:inline">/ <span id="dirty">0</span> kirli</small></div><div class="pill"><small>🥩 SERVİS</small><span id="served">0</span></div></div><div id="toast"></div><div id="hint">İstasyona bir kez dokun: karakter gidip işi otomatik tamamlar</div><div id="bottom"><button id="sinkBtn">🧽 Bulaşık yıka</button><button id="grillBtn">🔥 Köfte pişir</button><button id="cashBtn">🛎️ Servis yap</button></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,scale=1,ox=0,oy=0,last=0,clock=0,toastUntil=0;const VW=920,VH=680;const $=id=>document.getElementById(id);let save={};try{save=JSON.parse(localStorage.getItem('kofte_v19_save')||'{}')}catch(e){}const state={money:save.money||0,washed:save.washed||0,served:save.served||0,dirty:Math.max(3,save.dirty||4),cooked:0,customers:3,task:null,taskTime:0,taskMax:0,spawn:0,dishSpawn:0};let player={x:460,y:455,tx:460,ty:455,walk:0};const stations={sink:{x:215,y:380,px:265,py:430},grill:{x:490,y:325,px:500,py:410},cash:{x:710,y:342,px:700,py:432}};function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);scale=Math.min(W/VW,H/VH);ox=(W-VW*scale)/2;oy=(H-VH*scale)/2;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function rect(x,y,w,h,c,r=0){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function line(x,y,xx,yy,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke()}function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function txt(t,x,y,size=20,c='#294a3d',align='center'){ctx.font=`900 ${size}px system-ui`;ctx.fillStyle=c;ctx.textAlign=align;ctx.fillText(t,x,y)}function box(x,y,w,h,c,edge='#5e7c69'){rect(x+5,y+9,w,h,'#1b443a25',10);rect(x,y,w,h,edge,10);rect(x+4,y+4,w-8,h-10,c,7)}function person(x,y,shirt='#ec744e',hair='#483329',size=1){ctx.save();ctx.translate(x,y);ctx.scale(size,size);ellipse(0,21,24,10,'#153a3240');ellipse(-9,12,8,12,'#3a5549');ellipse(9,12,8,12,'#3a5549');ellipse(0,1,19,20,shirt);ellipse(-20,2,7,11,'#f6b98e');ellipse(20,2,7,11,'#f6b98e');ellipse(0,-24,17,18,'#f7bd91');ellipse(0,-37,18,9,hair);ellipse(-6,-24,2,2,'#4b3a2c');ellipse(6,-24,2,2,'#4b3a2c');ctx.restore()}function notice(t){$('toast').textContent=t;$('toast').style.opacity='1';toastUntil=clock+2.2}function persist(){try{localStorage.setItem('kofte_v19_save',JSON.stringify({money:state.money,washed:state.washed,served:state.served,dirty:state.dirty}))}catch(e){}}function setTask(name){state.task=null;state.pending=null;const s=stations[name];player.tx=s.px;player.ty=s.py;state.pending=name;notice(name==='sink'?'Lavaboya gidiliyor':name==='grill'?'Izgaraya gidiliyor':'Kasaya gidiliyor')}function begin(name){if(name==='sink'&&state.dirty<=0){notice('Yeni kirli tabaklar geliyor');return}if(name==='grill'&&state.cooked>=5){notice('Önce pişen köfteleri servis et');return}if(name==='cash'&&(state.cooked<=0||state.customers<=0)){notice(state.cooked<=0?'Önce köfte pişir':'Müşteri bekleniyor');return}state.task=name;state.taskTime=0;state.taskMax=name==='sink'?1.45:name==='grill'?2.1:1.05}function done(){let t=state.task;state.task=null;if(t==='sink'){state.dirty--;state.washed++;state.money+=12;notice('✨ Tabak yıkandı! +12 ₺')}if(t==='grill'){state.cooked++;notice('🥩 Köfte hazır!')}if(t==='cash'){state.cooked--;state.customers--;state.served++;state.money+=85;state.dirty++;notice('🎉 Sipariş teslim! +85 ₺')}updateHud();persist();const more=t==='sink'?state.dirty>0:t==='grill'?state.cooked<5:t==='cash'?state.cooked>0&&state.customers>0:false;if(more){begin(t)}else{notice(t==='sink'?'✨ Bütün bulaşıklar yıkandı':t==='grill'?'🥩 Izgara doldu, servise geç':'🛎️ Hazır siparişler teslim edildi')}}function updateHud(){$('money').textContent=state.money.toLocaleString('tr-TR')+' ₺';$('washed').textContent=state.washed;$('dirty').textContent=state.dirty;$('served').textContent=state.served}updateHud();function hit(x,y){const p={x:(x-ox)/scale,y:(y-oy)/scale};if(p.x<0||p.x>VW||p.y<0||p.y>VH)return;for(let k of ['sink','grill','cash']){const s=stations[k];if(Math.hypot(p.x-s.x,p.y-s.y)<100){setTask(k);return}}player.tx=Math.max(95,Math.min(815,p.x));player.ty=Math.max(300,Math.min(575,p.y));state.pending=null;state.task=null}canvas.addEventListener('pointerdown',e=>hit(e.clientX,e.clientY));$('sinkBtn').onclick=()=>setTask('sink');$('grillBtn').onclick=()=>setTask('grill');$('cashBtn').onclick=()=>setTask('cash');function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#173f34';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);rect(0,0,VW,VH,'#86c9a5');rect(42,80,836,526,'#d9b68d',30);rect(60,92,800,490,'#f7e5c9',20);for(let x=70;x<850;x+=52)for(let y=100;y<580;y+=52){line(x,y,x+52,y,'#e6cda9',1);line(x,y,x,y+52,'#e6cda9',1)}rect(58,95,800,18,'#a6d5c6',6);rect(58,95,18,490,'#a6d5c6',6);rect(840,95,18,490,'#a6d5c6',6);rect(58,565,800,18,'#a6d5c6',6);rect(340,130,14,290,'#d5a47b',6);txt('BULAŞIK & MUTFAK',240,154,21,'#476f59');txt('KASA & MÜŞTERİLER',675,154,21,'#476f59');
// sink area
box(105,205,208,92,'#d9edf1','#76a6a9');box(124,223,160,47,'#9bc6ce','#7d9fa7');ellipse(206,245,48,17,'#568b9c');ellipse(206,241,42,13,'#a8e6ed');txt('🚰',206,256,33);txt('LAVABO',210,315,18);for(let i=0;i<Math.min(state.dirty,7);i++){ellipse(118+i*24,347,17,8,'#718f8a');ellipse(118+i*24,342,16,7,'#fffefa')}txt('🍽️ '+state.dirty+' kirli',202,378,17,'#865b47');
// grill
box(382,204,220,102,'#a8afb3','#586e75');rect(401,222,182,60,'#474b4b',8);for(let i=0;i<8;i++)line(405+i*23,226,405+i*23,277,'#868b88',4);for(let i=0;i<Math.min(state.cooked,5);i++){ellipse(425+i*34,251,15,11,'#8d4a29');ellipse(425+i*34,249,12,8,'#b96d3b')}txt('🔥 IZGARA',494,332,19);txt('Hazır: '+state.cooked+' köfte',493,360,16,'#865b47');
// counter
box(635,256,166,96,'#e7b478','#a86e43');rect(644,264,147,24,'#f8ddae',6);txt('🛎️ KASA',715,303,22);txt('🥙',710,344,28);for(let i=0;i<Math.min(state.customers,5);i++)person(713+(i%2)*55,192-Math.floor(i/2)*56,['#679bda','#a777d1','#e7a84b','#67a97b','#e68d90'][i],'#533e31',.76);txt('Sipariş: Köfte!',711,112,17,'#9b553e');
// furniture and decoration
box(96,455,120,64,'#c69a72','#8b674d');txt('🍅 🥬',156,494,24);box(750,468,74,55,'#9bc8a0','#6b9876');txt('🪴',785,499,29);rect(90,121,65,18,'#f6f7df',6);txt('🧽',121,139,19);rect(560,475,88,58,'#b8dfb1',10);txt('🥤',605,513,28);
// waypoint marker
if(Math.hypot(player.tx-player.x,player.ty-player.y)>8){ellipse(player.tx,player.ty+20,18,8,'#2c947955');ellipse(player.tx,player.ty+20,9,4,'#e7fff3')}
person(player.x,player.y,'#f36e4d','#53342b',1.13);txt('SEN',player.x,player.y-68,15,'#26604b');if(state.task){const p=state.taskTime/state.taskMax;rect(player.x-39,player.y-93,78,12,'#fff',6);rect(player.x-36,player.y-90,72*p,6,'#45bf72',4);txt(state.task==='sink'?'🧽':state.task==='grill'?'🔥':'🥙',player.x,player.y-104,19)}txt('KÖFTE İMPARATORLUĞU',460,644,27,'#fff5d9');ctx.restore()}
function tick(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;clock+=dt;state.spawn+=dt;state.dishSpawn+=dt;if(state.spawn>5.8&&state.customers<5){state.customers++;state.spawn=0}if(state.dishSpawn>7.5&&state.dirty<10){state.dirty++;state.dishSpawn=0;updateHud()}let dx=player.tx-player.x,dy=player.ty-player.y,d=Math.hypot(dx,dy);if(d>3){const step=Math.min(d,210*dt);player.x+=dx/d*step;player.y+=dy/d*step;player.walk+=dt}else if(state.pending){const k=state.pending;state.pending=null;begin(k)}if(state.task){state.taskTime+=dt;if(state.taskTime>=state.taskMax)done()}if(clock>toastUntil)$('toast').style.opacity='0';draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);notice('👋 Lavaboya dokun ve işe başla!')})();
</script></body></html>
