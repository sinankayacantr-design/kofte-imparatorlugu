<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#183c33"><title>Köfte İmparatorluğu</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#193f37;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px;pointer-events:none;gap:8px}.pill{background:#fffdf1ed;border:2px solid #fff;border-radius:15px;box-shadow:0 3px 0 #23544755;padding:8px 12px;color:#254536;font-weight:900;font-size:15px}.pill small{display:block;font-size:10px;color:#607669;font-weight:700}.pill strong{color:#14845a}#toast{position:fixed;top:83px;left:50%;transform:translateX(-50%);background:#25483de8;color:white;border-radius:20px;padding:9px 15px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}#bottom{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;max-width:98%;align-items:center}button{border:2px solid #fff;background:#fff9df;color:#29503d;border-radius:15px;padding:9px 9px;font-weight:900;font-size:11px;box-shadow:0 4px 0 #254e3d66;white-space:nowrap}button:active{transform:translateY(2px)}#hint{position:fixed;bottom:calc(69px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#204d3bcc;color:#fff;padding:8px 13px;border-radius:18px;font-size:12px;white-space:nowrap;pointer-events:none;text-align:center}@media(max-width:430px){button{padding:7px 6px;font-size:10px}.pill{padding:7px;font-size:13px}}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="pill"><small>💰 RESTORAN KASASI</small><strong id="money">0 ₺</strong></div><div class="pill"><small>🍽️ YIKANAN TABAK</small><span id="washed">0</span> <small style="display:inline">/ <span id="dirty">0</span> kirli</small></div><div class="pill"><small>🥩 SERVİS</small><span id="served">0</span></div></div><div id="toast"></div><div id="murat" style="display:none;position:fixed;top:125px;left:50%;transform:translateX(-50%);max-width:92%;background:#fff6d9;border:2px solid #d1a668;border-radius:14px;padding:9px 12px;font-size:12px;font-weight:800;color:#4d3a29;pointer-events:none;z-index:2"><span id="muratText"></span></div><div id="progress" style="position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#fff9df;border-radius:12px;padding:5px 9px;font-size:11px;font-weight:800;white-space:nowrap">⭐ <span id="xp">Sv. 1 • 0 XP</span> · ❤️ <span id="mood">90%</span> · 🚶 <span id="lost">0</span> ayrıldı</div><div id="dayClock" style="position:fixed;top:94px;right:10px;background:#fff9dff0;color:#294a3d;padding:6px 10px;border-radius:12px;font-weight:800;font-size:12px;pointer-events:none">☀️ 08:00</div><div id="hint">Masadakiler ayrı sipariş verir • Paket müşterisi kasada bekler</div><div id="bottom"><button id="sinkBtn">🧽 Bulaşık yıka</button><button id="grillBtn">🔥 Köfte pişir</button><button id="cashBtn">🛎️ Paket / masa</button><button id="shopBtn">👕 Formalar</button></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,scale=1,ox=0,oy=0,last=0,clock=0,toastUntil=0,clockDisplaySecond=-1;const VW=920,VH=680;const $=id=>document.getElementById(id);let save={};try{save=JSON.parse(localStorage.getItem('kofte_v19_save')||'{}')}catch(e){}const state={money:save.money||0,washed:save.washed||0,served:save.served||0,dirty:Math.max(3,save.dirty||4),cooked:0,customers:2,task:null,taskTime:0,taskMax:0,spawn:0,dishSpawn:0,xp:save.xp||0,level:save.level||1,satisfaction:save.satisfaction??90,uniform:save.uniform||0,owned:save.owned||[0],queueAge:0,garsonTimer:0,warning:0,abandoned:save.abandoned||0, tables:[{x:290,y:465,eat:0,dirty:0,status:'free',wait:0},{x:460,y:465,eat:0,dirty:0,status:'free',wait:0},{x:630,y:465,eat:0,dirty:0,status:'free',wait:0}]};let player={x:460,y:535,tx:460,ty:535,walk:0};let waiter={x:144,y:435,tx:144,ty:435,job:null,phase:0};const stations={sink:{x:210,y:258,px:210,py:352},grill:{x:470,y:260,px:470,py:355},cash:{x:745,y:310,px:738,py:390}};function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);scale=Math.min(W/VW,H/VH);ox=(W-VW*scale)/2;oy=(H-VH*scale)/2;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function rect(x,y,w,h,c,r=0){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function line(x,y,xx,yy,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke()}function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function txt(t,x,y,size=20,c='#294a3d',align='center'){ctx.font=`900 ${size}px system-ui`;ctx.fillStyle=c;ctx.textAlign=align;ctx.fillText(t,x,y)}function box(x,y,w,h,c,edge='#5e7c69'){rect(x+5,y+9,w,h,'#1b443a25',10);rect(x,y,w,h,edge,10);rect(x+4,y+4,w-8,h-10,c,7)}function person(x,y,shirt='#ec744e',hair='#483329',size=1){ctx.save();ctx.translate(x,y);ctx.scale(size,size);ellipse(0,21,24,10,'#153a3240');ellipse(-9,12,8,12,'#3a5549');ellipse(9,12,8,12,'#3a5549');ellipse(0,1,19,20,shirt);ellipse(-20,2,7,11,'#f6b98e');ellipse(20,2,7,11,'#f6b98e');ellipse(0,-24,17,18,'#f7bd91');ellipse(0,-37,18,9,hair);ellipse(-6,-24,2,2,'#4b3a2c');ellipse(6,-24,2,2,'#4b3a2c');ctx.restore()}function notice(t){$('toast').textContent=t;$('toast').style.opacity='1';toastUntil=clock+2.2}function persist(){try{localStorage.setItem('kofte_v19_save',JSON.stringify({money:state.money,washed:state.washed,served:state.served,dirty:state.dirty,xp:state.xp,level:state.level,satisfaction:state.satisfaction,uniform:state.uniform,owned:state.owned,abandoned:state.abandoned}))}catch(e){}}function gainXP(n){state.xp+=n;let need=80+Math.floor(Math.pow(state.level,1.65)*55);if(state.xp>=need){state.xp-=need;state.level++;notice('⭐ Seviye '+state.level+'! Yeni hedeflere devam!')}}function mood(n){state.satisfaction=Math.max(0,Math.min(100,state.satisfaction+n))}function murat(msg){$('muratText').textContent='💬 Murat: '+msg;$('murat').style.display='block';state.warning=clock+5}function openShop(){let rows=[['🧽 Başlangıç',0,0],['🟦 Mavi forma',2,120],['🟩 Yeşil forma',3,250],['👨‍🍳 Mutfak forması',5,450],['👔 Müdür forması',10,1200]];let choices=rows.map((r,i)=>`${i+1}. ${r[0]} — ${r[2]} ₺ ${state.level<r[1]?'🔒 Seviye '+r[1]:state.owned.includes(i)?'✓ Sahip':'Satın al'}`).join('\\n');let choice=prompt('FORMA MAĞAZASI\\n'+choices+'\\n\\nSeçim numarası (1-5):');if(choice===null)return;let i=Number(choice)-1,r=rows[i];if(!r){notice('Geçersiz seçim');return}if(state.level<r[1]){notice('🔒 Bu forma için seviye '+r[1]+' gerekli');return}if(!state.owned.includes(i)){if(state.money<r[2]){notice('Yeterli oyun paran yok');return}state.money-=r[2];state.owned.push(i)}state.uniform=i;notice('👕 Forma değiştirildi!');persist();updateHud()}function setTask(name){state.task=null;state.pending=null;const s=stations[name];player.tx=s.px;player.ty=s.py;state.pending=name;notice(name==='sink'?'Lavaboya gidiliyor':name==='grill'?'Izgaraya gidiliyor':'Kasaya gidiliyor')}function begin(name){if(name==='sink'&&state.dirty<=0){notice('Yeni kirli tabaklar geliyor');return}if(name==='grill'&&state.cooked>=5){notice('Önce pişen köfteleri servis et');return}if(name==='cash'&&(state.cooked<=0||(state.customers<=0&&!state.tables.some(t=>t.status==='waiting')))){notice(state.cooked<=0?'Önce köfte pişir':'Müşteri bekleniyor');return}state.task=name;state.taskTime=0;state.taskMax=name==='sink'?.32:name==='grill'?.58:.32}function done(){let t=state.task;state.task=null;if(t==='sink'){state.dirty--;state.washed++;state.money+=12;gainXP(9);notice('✨ Tabak yıkandı! +12 ₺ / +9 XP')}if(t==='grill'){state.cooked++;gainXP(5);notice('🥩 Köfte hazır! +5 XP')}if(t==='cash'){
const waitingTable=state.tables.find(t=>t.status==='waiting');
if(waitingTable){waitingTable.status='eating';waitingTable.eat=18+Math.random()*9;waitingTable.wait=0;state.cooked--;state.served++;state.money+=85;gainXP(14);mood(1);notice('🍽️ Masaya köfte servis edildi! +85 ₺')}
else if(state.customers>0){state.cooked--;state.customers--;state.queueAge=0;state.served++;state.money+=85;gainXP(14);mood(1);notice('🥡 Paket sipariş teslim edildi! +85 ₺')}
}updateHud();persist();const more=t==='sink'?state.dirty>0:t==='grill'?state.cooked<5:t==='cash'?state.cooked>0&&(state.customers>0||state.tables.some(t=>t.status==='waiting')):false;if(more){begin(t)}else{notice(t==='sink'?'✨ Bütün bulaşıklar yıkandı':t==='grill'?'🥩 Izgara doldu, servise geç':'🛎️ Hazır siparişler teslim edildi')}}function updateHud(){$('money').textContent=state.money.toLocaleString('tr-TR')+' ₺';$('washed').textContent=state.washed;$('dirty').textContent=state.dirty;$('served').textContent=state.served;$('xp').textContent='Sv. '+state.level+' • '+state.xp+' XP';$('mood').textContent=state.satisfaction+'%';$('lost').textContent=state.abandoned}updateHud();function hit(x,y){const p={x:(x-ox)/scale,y:(y-oy)/scale};if(p.x<0||p.x>VW||p.y<0||p.y>VH)return;for(const t of state.tables){if(Math.hypot(p.x-t.x,p.y-t.y)<75&&t.status==='waiting'){setTask('cash');return}}
for(let k of ['sink','grill','cash']){const s=stations[k];if(Math.hypot(p.x-s.x,p.y-s.y)<100){setTask(k);return}}player.tx=Math.max(95,Math.min(815,p.x));player.ty=Math.max(300,Math.min(575,p.y));state.pending=null;state.task=null}canvas.addEventListener('pointerdown',e=>hit(e.clientX,e.clientY));$('sinkBtn').onclick=()=>setTask('sink');$('grillBtn').onclick=()=>setTask('grill');$('cashBtn').onclick=()=>setTask('cash');$('shopBtn').onclick=openShop;function gameTime(){const minutes=Math.floor(clock*6+8*60)%(24*60);return {hour:Math.floor(minutes/60),minute:minutes%60,night:minutes<360||minutes>=1140,evening:minutes>=1020&&minutes<1140}}function draw(){const time=gameTime();ctx.clearRect(0,0,W,H);ctx.fillStyle=time.night?'#152b4a':time.evening?'#b66e55':'#6bbd96';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);rect(0,0,VW,VH,time.night?'#294b6c':time.evening?'#d8a378':'#86c9a5');rect(42,80,836,526,'#d9b68d',30);rect(60,92,800,490,time.night?'#ecd8b4':time.evening?'#f3dfbe':'#f7e5c9',20);for(let x=70;x<850;x+=52)for(let y=100;y<580;y+=52){line(x,y,x+52,y,'#e6cda9',1);line(x,y,x,y+52,'#e6cda9',1)}rect(58,95,800,18,'#a6d5c6',6);rect(58,95,18,490,'#a6d5c6',6);rect(840,95,18,490,'#a6d5c6',6);rect(58,565,800,18,'#a6d5c6',6);rect(340,130,14,290,'#d5a47b',6);txt('PERSONEL • MUTFAK',310,154,20,'#476f59');txt('KÜÇÜK MAHALLE KÖFTECİSİ',674,154,17,'#476f59');
// Windows, warm lights and restaurant details
for(const wx of [400,585]){box(wx,119,112,68,time.night?'#243f72':time.evening?'#e5a16d':'#a5e4f6','#b17f55');line(wx+56,126,wx+56,180,'#f9e9c5',5);line(wx+7,153,wx+105,153,'#f9e9c5',4);if(time.night){txt('✦',wx+28,149,20,'#fff0ac');txt('☾',wx+81,151,23,'#ffe5a0')}else{txt('☀',wx+75,147,23,'#fff7bd')}}
txt('🌿',96,196,29);txt('🌿',820,198,29);
txt('🍴',390,414,20,'#a27c57');txt('🍴',595,415,20,'#a27c57');
// Rear kitchen: worktops behind the customers, counter separates the areas
box(90,196,244,106,'#d9edf1','#76a6a9');box(115,214,186,52,'#9bc6ce','#7d9fa7');ellipse(205,242,51,17,'#568b9c');ellipse(205,238,44,13,'#a8e6ed');txt('🚰',205,251,31);txt('🧽 LAVABO',207,322,18);
for(let i=0;i<Math.min(state.dirty,7);i++){ellipse(119+i*25,335,16,7,'#718f8a');ellipse(119+i*25,332,15,6,'#fffefa')}
box(364,195,215,108,'#a8afb3','#586e75');rect(382,215,180,62,'#474b4b',8);for(let i=0;i<8;i++)line(388+i*22,220,388+i*22,272,'#868b88',4);
for(let i=0;i<Math.min(state.cooked,5);i++){ellipse(408+i*33,247,14,11,'#8d4a29');ellipse(408+i*33,245,11,8,'#b96d3b')}
txt('🔥 IZGARA',468,323,18);txt('Hazır: '+state.cooked,469,346,15,'#865b47');
box(630,215,175,102,'#e7b478','#a86e43');rect(641,225,152,21,'#f8ddae',6);txt('🛎️ KASA',716,268,22);txt('🥡 PAKET',717,292,15);
box(89,363,726,26,'#b67b50','#85573e');txt('MUTFAK / PERSONEL ALANI',451,383,14,'#fff2da');
// Dining space and table orders
txt('🍽️ MASADA SERVİS',451,414,18,'#795b42');
for(const t of state.tables){
ellipse(t.x,t.y+36,66,12,'#4b453022');
box(t.x-57,t.y-27,114,62,'#d4a46c','#9b6d43');ellipse(t.x,t.y+2,21,13,'#fff8e5');
if(t.status==='waiting'){person(t.x-35,t.y-37,'#a57ed6','#634734',.7);txt('🥙 SİPARİŞ',t.x,t.y-56,16,'#a14d35')}
else if(t.status==='eating'){person(t.x-35,t.y-37,'#a57ed6','#634734',.7);txt('🥙',t.x,t.y+10,20)}
else {txt('BOŞ',t.x,t.y+8,13,'#876748')}
}
// Cash customers stay at the entrance and do not walk into the kitchen
for(let i=0;i<Math.min(state.customers,5);i++)person(745+(i%2)*47,465+Math.floor(i/2)*50,['#679bda','#a777d1','#e7a84b','#67a97b','#e68d90'][i],'#533e31',.72);
txt('🥡 PAKET SIRASI',746,433,15,'#795b42');
rect(666,552,156,24,'#8cc6a0',9);txt('🚪 GİRİŞ / ÇIKIŞ',744,570,16,'#315c47');
// Waiter walks between the dining area and tables; slower than the player.
person(waiter.x,waiter.y,'#e8e3c6','#5d3b2a',.9);txt('GARSON',waiter.x,waiter.y-52,14,'#476f59');if(waiter.job){txt('🍽️',waiter.x+22,waiter.y-27,16,'#8a5b36')}
txt('🌿',101,550,30);txt('🌿',815,552,30);
// waypoint marker
if(Math.hypot(player.tx-player.x,player.ty-player.y)>8){ellipse(player.tx,player.ty+20,18,8,'#2c947955');ellipse(player.tx,player.ty+20,9,4,'#e7fff3')}
person(player.x,player.y,['#f36e4d','#5088cf','#57a870','#fafafa','#293d52'][state.uniform]||'#f36e4d','#53342b',1.13);txt('SEN',player.x,player.y-68,15,'#26604b');if(state.task){const p=state.taskTime/state.taskMax;rect(player.x-39,player.y-93,78,12,'#fff',6);rect(player.x-36,player.y-90,72*p,6,'#45bf72',4);txt(state.task==='sink'?'🧽':state.task==='grill'?'🔥':'🥙',player.x,player.y-104,19)}txt('KÖFTE İMPARATORLUĞU',460,644,27,'#fff5d9');
if(time.night||time.evening){ctx.fillStyle=time.night?'rgba(19,33,80,0.19)':'rgba(122,68,65,0.10)';ctx.fillRect(40,80,840,527);for(const lx of [195,475,735]){const glow=ctx.createRadialGradient(lx,160,8,lx,160,145);glow.addColorStop(0,time.night?'rgba(255,220,126,.32)':'rgba(255,226,145,.15)');glow.addColorStop(1,'rgba(255,220,126,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(lx,160,145,0,Math.PI*2);ctx.fill();txt('💡',lx,117,22)}}ctx.restore()}
function tick(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;clock+=dt;if(Math.floor(clock)!==clockDisplaySecond){clockDisplaySecond=Math.floor(clock);const gt=gameTime();$('dayClock').textContent=(gt.night?'🌙 ':gt.evening?'🌇 ':'☀️ ')+String(gt.hour).padStart(2,'0')+':'+String(gt.minute).padStart(2,'0')}state.spawn+=dt;state.dishSpawn+=dt;if(state.spawn>5.8){state.spawn=0;
if(Math.random()<0.55){const free=state.tables.find(t=>t.status==='free');if(free){free.status='waiting';free.wait=0}else if(state.customers<5)state.customers++}
else if(state.customers<5)state.customers++
}if(state.customers>0){state.queueAge+=dt;if(state.queueAge>75){state.customers--;state.queueAge=0;state.abandoned++;mood(-3);murat('Kasada bekleyen müşteri ayrıldı! Memnuniyet düştü.');persist()}}else state.queueAge=0;if(state.customers>=3&&state.queueAge>38&&clock>state.warning){murat('Kasada yoğunluk var, fırsat bulunca yardım eder misin?')}for(const t of state.tables){
if(t.status==='waiting'){t.wait+=dt;if(t.wait>75){t.status='free';t.wait=0;state.abandoned++;mood(-3);notice('Masadaki müşteri uzun bekledi ve ayrıldı')}}
if(t.status==='eating'){t.eat-=dt;if(t.eat<=0){t.eat=0;t.status='free';state.dirty++;notice('🍽️ Müşteri yemeğini bitirdi, tabak lavaboya gitti!');persist()}}
}
// Waiter patrols to a waiting table and visibly delivers the order.
state.garsonTimer+=dt;
if(!waiter.job && state.garsonTimer>15){
 state.garsonTimer=0;
 const t=state.tables.find(t=>t.status==='waiting'&&t.wait>5);
 if(t&&state.cooked>0){waiter.job={table:t,stage:'out'};waiter.tx=t.x-76;waiter.ty=t.y+34;}
}
const wdx=waiter.tx-waiter.x,wdy=waiter.ty-waiter.y,wd=Math.hypot(wdx,wdy);
if(wd>2){const ws=Math.min(wd,145*dt);waiter.x+=wdx/wd*ws;waiter.y+=wdy/wd*ws;waiter.phase+=dt*8;}
else if(waiter.job&&waiter.job.stage==='out'){
 const t=waiter.job.table;
 if(t.status==='waiting'&&state.cooked>0){t.status='eating';t.eat=18+Math.random()*9;t.wait=0;state.cooked--;state.served++;state.money+=85;gainXP(10);notice('👨‍🍳 Garson masaya yürüyerek servis yaptı!');persist();}
 waiter.job.stage='home';waiter.tx=144;waiter.ty=435;
}else if(waiter.job&&waiter.job.stage==='home'){
 waiter.job=null;
}
if(state.dishSpawn>12&&state.dirty<10){state.dirty++;state.dishSpawn=0}if(clock>state.warning)$('murat').style.display='none';updateHud();let dx=player.tx-player.x,dy=player.ty-player.y,d=Math.hypot(dx,dy);if(d>3){const step=Math.min(d,250*dt);player.x+=dx/d*step;player.y+=dy/d*step;player.walk+=dt}else if(state.pending){const k=state.pending;state.pending=null;begin(k)}if(state.task){state.taskTime+=dt;if(state.taskTime>=state.taskMax)done()}if(clock>toastUntil)$('toast').style.opacity='0';draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);notice('🎉 v2.5! Garson artık masalara yürüyerek servis yapıyor.');murat('Yeni vardiya başladı! Garson masalara yürüyerek servis yapacak. Sen daha hızlı çalışabilir ve paket siparişlere yardım edebilirsin!')})();
</script></body></html>
